<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <div class="calculator">
      <div class="top-bar">
        <h1>Calculator</h1>
        <div class="top-bar-actions">
          <button id="sci-toggle" title="Toggle scientific functions">xʸ</button>
          <button id="theme-toggle" title="Toggle theme">🌙</button>
        </div>
      </div>

      <div class="display">
        <div id="expression" class="expression"></div>
        <div id="result" class="result">0</div>
      </div>

      <div id="sci-buttons" class="sci-buttons hidden">
        <button class="btn sci" data-action="unary" data-value="sin">sin</button>
        <button class="btn sci" data-action="unary" data-value="cos">cos</button>
        <button class="btn sci" data-action="unary" data-value="tan">tan</button>
        <button class="btn sci function" id="angle-toggle" data-action="toggle-angle">DEG</button>

        <button class="btn sci" data-action="unary" data-value="log">log</button>
        <button class="btn sci" data-action="unary" data-value="ln">ln</button>
        <button class="btn sci" data-action="unary" data-value="sqrt">√x</button>
        <button class="btn sci" data-action="unary" data-value="square">x²</button>

        <button class="btn sci operator" data-action="operator" data-value="^">xʸ</button>
        <button class="btn sci" data-action="unary" data-value="reciprocal">1/x</button>
        <button class="btn sci" data-action="unary" data-value="pi">π</button>
        <button class="btn sci" data-action="unary" data-value="e">e</button>

        <button class="btn sci wide" data-action="unary" data-value="factorial">n!</button>
        <button class="btn sci wide" data-action="unary" data-value="negate">±</button>
      </div>

      <div class="buttons">
        <button class="btn function" data-action="clear">AC</button>
        <button class="btn function" data-action="delete">DEL</button>
        <button class="btn function" data-action="percent">%</button>
        <button class="btn operator" data-action="operator" data-value="/">÷</button>

        <button class="btn" data-action="number" data-value="7">7</button>
        <button class="btn" data-action="number" data-value="8">8</button>
        <button class="btn" data-action="number" data-value="9">9</button>
        <button class="btn operator" data-action="operator" data-value="*">×</button>

        <button class="btn" data-action="number" data-value="4">4</button>
        <button class="btn" data-action="number" data-value="5">5</button>
        <button class="btn" data-action="number" data-value="6">6</button>
        <button class="btn operator" data-action="operator" data-value="-">−</button>

        <button class="btn" data-action="number" data-value="1">1</button>
        <button class="btn" data-action="number" data-value="2">2</button>
        <button class="btn" data-action="number" data-value="3">3</button>
        <button class="btn operator" data-action="operator" data-value="+">+</button>

        <button class="btn wide" data-action="number" data-value="0">0</button>
        <button class="btn" data-action="decimal">.</button>
        <button class="btn equals" data-action="equals">=</button>
      </div>
    </div>

    <div class="history-panel">
      <div class="history-header">
        <h2>History</h2>
        <button id="clear-history">Clear</button>
      </div>
      <ul id="history-list" class="history-list"></ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
